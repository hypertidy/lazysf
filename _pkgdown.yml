url: https://hypertidy.github.io/lazysf/

template:
  bootstrap: 5

development:
  mode: auto

reference:

- title: Lazy tables from GDAL vector sources
  desc: >
    Create a lazy table from any GDAL-readable vector data source and pull
    results into memory with collect(). Standard dplyr verbs are translated
    to SQL and executed by GDAL.
  contents:
  - lazysf
  - collect
  - lazysf-package

- title: DBI interface
  desc: >
    Connect directly with DBI for finer control over dialect, geometry
    format, and the Arrow stream interface.
  contents:
  - GDALSQL
  - dbConnect,GDALVectorDriver-method

- title: DBI classes and methods
  desc: >
    S4 classes for the GDAL vector driver, connection, and result, with
    their DBI methods (dbListTables, dbListFields, dbSendQuery, dbFetch,
    and friends).
  contents:
  - GDALVectorDriver-class
  - GDALVectorConnection-class
  - GDALVectorResult-class

articles:
- title: Articles
  contents:
  - GDALSQL
